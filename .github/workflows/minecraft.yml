
name: Minecraft Java Server Test

on:
  workflow_dispatch:

jobs:
  minecraft-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Minecraft Server
        run: |
          VERSION=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.latest.release')

          echo "Minecraft version: $VERSION"

          URL=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | jq -r --arg VERSION "$VERSION" '.versions[] | select(.id == $VERSION) | .url')

          SERVER_URL=$(curl -fsSL "$URL" | jq -r '.downloads.server.url')

          curl -fL "$SERVER_URL" -o server.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Start Minecraft Server
        run: |
          echo "Starting Minecraft server..."
          timeout 180s java -Xms1G -Xmx2G -jar server.jar nogui || STATUS=$?

          if [ "${STATUS:-0}" -eq 124 ]; then
            echo "Test completed: server was stopped after 180 seconds."
          elif [ "${STATUS:-0}" -ne 0 ]; then
            echo "Server exited with status ${STATUS}"
            exit "$STATUS"
          fi

      - name: Show Server Logs
        if: always()
        run: |
          if [ -f logs/latest.log ]; then
            tail -n 60 logs/latest.log
          else
            echo "No Minecraft log was generated."
          fi
